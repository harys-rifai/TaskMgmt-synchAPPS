{% extends "admin/change_form.html" %}
{% load i18n %}

{% block object-tools-items %}
    {{ block.super }}
    {% if show_test_button %}
        <li>
            <form method="post" style="display:inline;">
                {% csrf_token %}
                <input type="hidden" name="_test_email" value="1">

                    Test Connection
                </button>
            </form>
        </li>
    {% endif %}
{% endblock %}
