{% extends "admin/change_form.html" %}
{% load i18n %}

{% block object-tools-items %}
    {{ block.super }}
    {% if object.pk %}
    <li>
        <form method="post" action="{% url 'admin:tasks_redisconfig_test' object.pk %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-secondary" style="margin-top: 5px;">
                Test Connection
            </button>
        </form>
    </li>
    {% endif %}
{% endblock %}
