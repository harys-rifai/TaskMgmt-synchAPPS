{% load i18n static %}
<div class="input-group input-group-sm">
    <input type="{{ widget.type }}" name="{{ widget.name }}"{% if widget.value != None %} value="{{ widget.value|stringformat:'s' }}"{% endif %} class="{{ widget.attrs.class }}" placeholder="{{ widget.attrs.placeholder }}" autocomplete="off" />
    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="{{ widget.attrs.id }}" title="{% trans 'Show/Hide' %}">
        <i class="fa fa-eye"></i>
    </button>
</div>
<script>
(function() {
    const btn = document.querySelector('.toggle-password[data-target="{{ widget.attrs.id }}"]');
    if (!btn) return;
    const input = document.getElementById("{{ widget.attrs.id }}");
    if (!input) return;
    btn.addEventListener('click', function() {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        btn.querySelector('i').className = isPassword ? 'fa fa-eye-slash' : 'fa fa-eye';
    });
})();
</script>
