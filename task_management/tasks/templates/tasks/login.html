<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Task Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1d2e 0%, #2a2f4a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 24px 64px rgba(0,0,0,.45);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #3b5bdb 0%, #1e3a8a 100%);
            padding: 2rem;
            text-align: center;
            color: #fff;
        }

        .login-header .brand-icon {
            font-size: 2.5rem;
            margin-bottom: .5rem;
        }

        .login-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0;
        }

        .login-header p {
            margin: .25rem 0 0;
            font-size: .85rem;
            opacity: .8;
        }

        .login-body {
            background: #fff;
            padding: 2rem;
        }

        .form-control:focus {
            border-color: #3b5bdb;
            box-shadow: 0 0 0 .2rem rgba(59,91,219,.2);
        }

        .btn-login {
            background: linear-gradient(135deg, #3b5bdb 0%, #1e3a8a 100%);
            border: none;
            padding: .65rem;
            font-weight: 600;
            letter-spacing: .03em;
            transition: opacity .2s;
        }

        .btn-login:hover { opacity: .9; }

        .input-group-text {
            background: #f8f9fa;
            border-right: none;
            color: #6c757d;
        }

        .form-control { border-left: none; }
        .form-control:focus { border-left: none; }

        .login-footer {
            background: #f8f9fa;
            padding: .9rem 2rem;
            text-align: center;
            font-size: .78rem;
            color: #6c757d;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- Header -->
    <div class="login-header">
        <div class="brand-icon">
            <i class="fa fa-circle-nodes"></i>
        </div>
        <h1>TaskMgmt</h1>
        <p>Sign in to your account</p>
    </div>

    <!-- Body -->
    <div class="login-body">

        {% if form.errors %}
        <div class="alert alert-danger alert-dismissible fade show py-2 mb-3" role="alert">
            <i class="fa fa-circle-exclamation me-2"></i>
            Invalid username or password. Please try again.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        {% if next %}
        <div class="alert alert-warning py-2 mb-3">
            <i class="fa fa-lock me-2"></i>Please sign in to access that page.
        </div>
        {% endif %}

        <form method="post" action="/login/">
            {% csrf_token %}
            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small">USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa fa-user"></i>
                    </span>
                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Enter your username"
                           autofocus
                           autocomplete="username"
                           value="{{ form.username.value|default:'' }}">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa fa-lock"></i>
                    </span>
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter your password"
                           autocomplete="current-password">
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-login text-white">
                    <i class="fa fa-right-to-bracket me-2"></i>Sign In
                </button>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <div class="login-footer">
        <i class="fa fa-shield-halved me-1"></i>
        Protected system — authorised users only
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
