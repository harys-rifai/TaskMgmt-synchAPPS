<div class="modal-header">
    <h5 class="modal-title">
        <i class="fa fa-user-plus me-2"></i>Assign Task — {{ task.job_id }}
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
    <form hx-post="/tasks/{{ task.id }}/do-assign/"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          hx-target="#assign-modal-content"
          hx-swap="innerHTML">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold">Assign to Team</label>
            <select name="assign_to" class="form-select">
                <option value="">— Unassigned —</option>
                {% for team in teams %}
                <option value="{{ team.id }}" {% if task.assign_to_id == team.id %}selected{% endif %}>
                    {{ team.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-primary">
                <i class="fa fa-check me-1"></i>Assign
            </button>
        </div>
    </form>
</div>
