<table class="table table-hover table-sm mb-0">
    <thead class="table-light">
        <tr>
            <th>Target Name</th>
            <th class="text-end">Total</th>
            <th class="text-end">Open</th>
            <th class="text-end">In Progress</th>
            <th class="text-end">Closed</th>
            <th class="text-end">High Priority</th>
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
        <tr>
            <td class="fw-semibold">{{ row.target }}</td>
            <td class="text-end">{{ row.total }}</td>
            <td class="text-end">
                <span class="badge bg-warning text-dark">{{ row.open }}</span>
            </td>
            <td class="text-end">
                <span class="badge bg-info">{{ row.in_progress }}</span>
            </td>
            <td class="text-end">
                <span class="badge bg-secondary">{{ row.closed }}</span>
            </td>
            <td class="text-end">
                <span class="badge bg-danger">{{ row.high }}</span>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6" class="text-center text-muted py-3">
                <i class="fa fa-inbox me-1"></i>No task data
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
